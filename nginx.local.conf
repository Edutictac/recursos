server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://recursos-api:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Els .swf d'assets/flash/ es comproven amb un HEAD des de scripts/flash.js
    # per decidir si n'hi ha una copia local o cal caure al fitxer remot en
    # recursos.edutictac.es. Sense esta location, el fallback SPA de mes avall
    # respon 200 amb index.html per a qualsevol ruta inexistent, i el HEAD
    # sempre pareix "existir" -- el fallback remot mai s'activa.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
